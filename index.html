<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barali Beach Resort</title>
  <link rel="icon" href="/image/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+Thai" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background"></div>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="/image/logo.png" alt="Barali Beach Resort Logo" />
      </div>
      <div class="nav-links">
        <div class="left-links">
          <a href="#home">หน้าแรก</a>
          <a href="/villas.html">วิลล่า</a>
          <a href="#location">โลเคชั่น</a>
          <a href="#offer">ข้อเสนอพิเศษ</a>
        </div>
        <div class="right-links">
          <a href="/login.html">เข้าสู่ระบบ</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="container">  
    <section class="welcome-wrapper">
      <div class="welcome-text">
        <h1>ยินดีต้อนรับสู่</h1>
        <h2>บาราลี บีช รีสอร์ท เกาะช้าง</h2>
      </div>

      <div class="search-box">
        <form action="/search-results.html" method="GET">
          <div class="form-group-date">
            <label>เช็คอิน<br />
              <input type="date" name="checkin" required />
            </label>
            <label>เช็คเอาท์<br />
              <input type="date" name="checkout" required />
            </label>
          </div>

          <div class="form-group">
            <label>ประเภทห้อง<br />
              <select name="room">
                <option value="" disabled selected hidden>-- กรุณาเลือก --</option>
                <option>วิลล่าหรู</option>
                <option>วิลล่าหรูระดับพรีเมียร์</option>
                <option>วิลล่าริมชายหาด</option>
                <option>วิลล่าพร้อมสระว่ายน้ำส่วนตัว</option>
                <option>วิลล่าห้องจูเนียร์สวีท</option>
              </select>
            </label>
          </div>

          <div class="guest-group">
            <div class="adult">
              <label>ผู้ใหญ่<br />
                <select name="adult">
                  <option value="" disabled selected hidden>-- กรุณาเลือก --</option>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                  <option>6</option>
                  <option>7</option>
                  <option>8</option>
                  <option>9</option>
                  <option>10</option>
                  <option>11</option>
                  <option>12</option>
                  <option>13</option>
                  <option>14</option>
                  <option>15</option>
                </select>
              </label>
            </div>

            <div class="child">
              <label>เด็ก<br />
                <select name="child">
                  <option value="" disabled selected hidden>-- กรุณาเลือก --</option>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                </select>
              </label>
            </div>

            <div class="search">
              <button type="submit" class="btn">ค้นหา</button>
            </div>
        </form>
      </div>
    </section>

    <div class="resort-photo">
      <img src="/image/beachfront-villa1.jpg" alt="Beachfront Villa">
      <img src="/image/facilities5.jpg" alt="Facilities">
      <img src="/image/overview17.jpg" alt="Resort Overview">
    </div>
  </div>
</body>

</html>
